name: NYX Pawn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl tar

      - name: Download Pawn compiler 3.10.11
        run: |
          curl -L --fail --retry 3 -o pawnc.tar.gz https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz
          mkdir -p .pawnc
          tar -xzf pawnc.tar.gz -C .pawnc
          find .pawnc -type f -maxdepth 3 -print
          chmod +x $(find .pawnc -type f -name pawncc | head -1)

      - name: Compile NYX
        shell: bash
        run: |
          PAWNCC=$(find .pawnc -type f -name pawncc | head -1)
          if [ -z "$PAWNCC" ]; then echo 'pawncc not found'; exit 1; fi
          mkdir -p build
          "$PAWNCC" -i"pawno/include" -O2 -Z -d3 -o"build/nyx_roleplay.amx" "gamemodes/nyx_roleplay.pwn"
          cp gamemodes/nyx_roleplay.pwn build/nyx_roleplay.pwn

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay.pwn build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            nyx-test-build.tar.gz
