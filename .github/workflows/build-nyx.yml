name: NYX Pawn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pawn compiler
        run: pawncc 2>&1 | head -n 2 || true

      - name: Install standard Pawn includes for build
        run: |
          set -e
          mkdir -p /tmp/samp-stdlib
          wget -qO /tmp/samp-stdlib.tar.gz https://github.com/pawn-lang/samp-stdlib/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/samp-stdlib.tar.gz -C /tmp/samp-stdlib --strip-components=1
          cp /tmp/samp-stdlib/*.inc pawno/include/
          wget -qO pawno/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc

      - name: Inject NYX staff layer
        run: |
          set -e
          sed -i '/#include <nyx_graphics>/a #include <nyx_admin_text>' gamemodes/nyx_roleplay.pwn
          sed -i '/if(!NYX_Player\[playerid\]\[NYX_Logged\]) return 1;/a\    if(NYX_AdminCommandText(playerid, cmdtext)) return 1;' gamemodes/nyx_roleplay.pwn

      - name: Compile NYX GameMode
        run: |
          set -o pipefail
          mkdir -p build
          pawncc -i"pawno/include" -O2 -d3 -Z -o"build/nyx_roleplay.amx" "gamemodes/nyx_roleplay.pwn" 2>&1 | tee build/compile.log
          test -s build/nyx_roleplay.amx
          cp gamemodes/nyx_roleplay.pwn build/nyx_roleplay.pwn

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay.pwn build/nyx_test/
          cp build/compile.log build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            build/compile.log
            nyx-test-build.tar.gz
