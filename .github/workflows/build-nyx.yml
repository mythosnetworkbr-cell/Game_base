name: NYX Pawn Build

on:
  push:
    branches:
      - main
      - nyx-build-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install standard SA-MP includes
        run: |
          set -e
          mkdir -p /tmp/samp-stdlib
          wget -q --tries=3 --timeout=30 https://github.com/pawn-lang/samp-stdlib/archive/refs/heads/master.tar.gz -O /tmp/samp-stdlib.tar.gz
          tar -xzf /tmp/samp-stdlib.tar.gz -C /tmp/samp-stdlib --strip-components=1
          test -s /tmp/samp-stdlib/a_samp.inc

      - name: Verify Pawn compiler
        run: pawncc 2>&1 | head -n 3 || true

      - name: Compile NYX GameMode
        run: |
          set -o pipefail
          mkdir -p build
          pawncc -i"/tmp/samp-stdlib" -i"gamemodes" -i"pawno/include" -O2 -d3 -Z -o"build/nyx_roleplay.amx" "gamemodes/nyx_roleplay.pwn" 2>&1 | tee build/compile.log
          test -s build/nyx_roleplay.amx

      - name: Compile NYX Staff entrypoint
        run: |
          set -o pipefail
          pawncc -i"/tmp/samp-stdlib" -i"gamemodes" -i"pawno/include" -O2 -d3 -Z -o"build/nyx_roleplay_staff.amx" "gamemodes/nyx_roleplay_staff.pwn" 2>&1 | tee -a build/compile.log
          test -s build/nyx_roleplay_staff.amx

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp gamemodes/nyx_roleplay.pwn build/nyx_test/
          cp gamemodes/nyx_roleplay_staff.pwn build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay_staff.amx build/nyx_test/
          cp build/compile.log build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay_staff.amx
            build/compile.log
            nyx-test-build.tar.gz
