name: NYX Pawn Build

on:
  push:
    branches: [ main ]
    paths:
      - 'gamemodes/**'
      - 'pawno/include/**'
      - '.github/workflows/build-nyx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          set -e
          curl -L --fail --retry 3 -o pawnc.tar.gz https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc

      - name: Prepare includes
        run: |
          set -e
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib
          git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib.git omp-stdlib
          mkdir -p build/include
          find samp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find omp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find pawno/include -maxdepth 1 -type f -name '*.inc' -exec cp {} build/include/ \;
          curl -L --fail --retry 3 -o build/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          test -s build/include/a_samp.inc
          test -s pawno/include/nyx_config.inc
          test -s pawno/include/nyx_accounts.inc

      - name: Compile NYX GameMode
        run: |
          set -euo pipefail
          COMPILER=$(find pawnc -type f -name pawncc | head -1)
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH:-}"
          mkdir -p build
          "$COMPILER" "gamemodes/nyx_roleplay.pwn" "-i:pawno/include" "-i:build/include" "-;+" "-(+" "-Z-" "-d3" "-O2" "-t4" "-o:build/nyx_roleplay" 2>&1 | tee build/compile.log
          test -s build/nyx_roleplay.amx

      - name: Package build
        run: |
          mkdir -p build/nyx_test
          cp build/nyx_roleplay.amx build/nyx_test/
          cp gamemodes/nyx_roleplay.pwn build/nyx_test/
          cp build/compile.log build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX and logs
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            build/compile.log
            nyx-test-build.tar.gz
          if-no-files-found: error
