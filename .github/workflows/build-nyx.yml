name: NYX Pawn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install standard Pawn includes for build
        run: |
          set -e
          mkdir -p /tmp/omp-stdlib
          curl -L --fail --retry 3 -o /tmp/omp-stdlib.tar.gz https://github.com/openmultiplayer/omp-stdlib/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/omp-stdlib.tar.gz -C /tmp/omp-stdlib --strip-components=1
          cp /tmp/omp-stdlib/*.inc pawno/include/
          curl -L --fail --retry 3 -o pawno/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc

      - name: Verify Pawn compiler container
        run: docker run --rm michaelace/pawncc:3.10.11-linux pawncc 2>&1 | head -n 2 || true

      - name: Integrate NYX staff dispatcher
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('gamemodes/nyx_roleplay.pwn')
          s = p.read_text(encoding='utf-8')

          include = '#include <nyx_admin_text>'
          if include not in s:
              anchor = re.compile(r'(#include\s+<nyx_player>\s*\r?\n)')
              match = anchor.search(s)
              if not match:
                  raise SystemExit('ERRO: include <nyx_player> nao encontrado; integracao abortada.')
              s = s[:match.end()] + include + '\n' + s[match.end():]

          callback = re.compile(r'public\s+OnPlayerCommandText\s*\(\s*playerid\s*,\s*cmdtext\s*\[\s*\]\s*\)\s*\{')
          match = callback.search(s)
          if not match:
              raise SystemExit('ERRO: callback OnPlayerCommandText nao encontrada; nenhum arquivo foi compilado.')

          dispatch = '    if(NYX_AdminCommandText(playerid, cmdtext)) return 1;\n'
          body_start = match.end()
          body_end = s.find('\n}', body_start)
          if body_end < 0:
              body_end = min(len(s), body_start + 4096)
          if 'NYX_AdminCommandText(playerid' not in s[body_start:body_end]:
              s = s[:body_start] + '\n' + dispatch + s[body_start:]

          p.write_text(s, encoding='utf-8')
          print('NYX Admin Text integrado com sucesso.')
          PY

          grep -n "#include <nyx_admin_text>" gamemodes/nyx_roleplay.pwn
          grep -n "NYX_AdminCommandText(playerid" gamemodes/nyx_roleplay.pwn

      - name: Compile NYX GameMode
        run: |
          set -o pipefail
          mkdir -p build
          docker run --rm -v "$PWD":/workspace -w /workspace michaelace/pawncc:3.10.11-linux pawncc -i"pawno/include" -O2 -d3 -Z -o"build/nyx_roleplay.amx" "gamemodes/nyx_roleplay.pwn" 2>&1 | tee build/compile.log
          test -s build/nyx_roleplay.amx
          cp gamemodes/nyx_roleplay.pwn build/nyx_roleplay.pwn

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay.pwn build/nyx_test/
          cp build/compile.log build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            build/compile.log
            nyx-test-build.tar.gz
