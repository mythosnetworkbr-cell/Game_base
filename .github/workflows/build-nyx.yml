name: NYX Pawn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  INCLUDE: "gamemodes;pawno/include"

jobs:
  build:
    runs-on: ubuntu-latest
    container: michaelace/pawncc:3.10.11-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pawn compiler
        run: pawncc 2>&1 | head -n 2 || true

      - name: Compile NYX staff GameMode
        run: |
          set -o pipefail
          mkdir -p build
          pawncc -O2 -d3 -Z -o"build/nyx_roleplay.amx" "gamemodes/nyx_roleplay_staff.pwn" 2>&1 | tee build/compile.log
          test -s build/nyx_roleplay.amx
          cp gamemodes/nyx_roleplay_staff.pwn build/nyx_roleplay.pwn

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay.pwn build/nyx_test/
          cp build/compile.log build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            build/compile.log
            nyx-test-build.tar.gz
