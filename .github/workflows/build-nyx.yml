name: NYX Pawn Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: michaelace/pawncc:3.10.11-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify compiler
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/lib:/lib
          pawncc -i

      - name: Compile NYX
        shell: bash
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/lib:/lib
          mkdir -p build
          pawncc gamemodes/nyx_roleplay.pwn \
            '-D./' \
            '-O2' \
            '-;+' \
            '-(+' \
            '-d3' \
            '-i pawno/include' \
            '-Z' \
            '-o build/nyx_roleplay.amx'
          cp gamemodes/nyx_roleplay.pwn build/nyx_roleplay.pwn

      - name: Package test build
        run: |
          mkdir -p build/nyx_test
          cp -r pawno/include build/nyx_test/
          cp build/nyx_roleplay.amx build/nyx_test/
          cp build/nyx_roleplay.pwn build/nyx_test/
          tar -czf nyx-test-build.tar.gz -C build nyx_test

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: nyx-test-build
          path: |
            build/nyx_roleplay.amx
            build/nyx_roleplay.pwn
            nyx-test-build.tar.gz
