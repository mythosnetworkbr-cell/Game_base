name: Build NYX GameMode

on:
  push:
    paths:
      - 'gamemodes/**'
      - 'filterscripts/**'
      - 'pawno/include/**'
      - '.github/workflows/build-nyx-gamemode.yml'
      - 'server.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          curl -L --fail --retry 3 -o pawnc.tar.gz https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc

      - name: Get SA-MP includes and runtime plugins
        run: |
          set -e
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib
          git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib.git omp-stdlib
          mkdir -p build/include build/plugins
          find samp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find omp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find pawno/include -maxdepth 1 -type f -name '*.inc' -exec cp {} build/include/ \;
          curl -L --fail --retry 3 -o build/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          test -s build/include/a_samp.inc
          test -s build/include/sscanf2.inc

          curl -L --fail --retry 3 -o sscanf-linux.tar.gz https://github.com/Y-Less/sscanf/releases/download/v2.13.8/sscanf-2.13.8-linux.tar.gz
          mkdir -p third_party/sscanf
          tar -xzf sscanf-linux.tar.gz -C third_party/sscanf
          find third_party/sscanf -type f -name 'sscanf.so' -exec cp {} build/plugins/sscanf.so \;

          curl -L --fail --retry 3 -o pawncmd-linux.tar.gz https://github.com/katursis/Pawn.CMD/releases/download/3.3.6/pawncmd-3.3.6-linux.tar.gz
          mkdir -p third_party/pawncmd
          tar -xzf pawncmd-linux.tar.gz -C third_party/pawncmd
          find third_party/pawncmd -type f -name 'pawncmd.so' -exec cp {} build/plugins/pawncmd.so \;

          test -s build/plugins/sscanf.so
          test -s build/plugins/pawncmd.so

      - name: Validate NYX source
        run: |
          test -s gamemodes/nyx_roleplay.pwn
          test -s pawno/include/nyx_config.inc
          test -s pawno/include/nyx_accounts.inc
          test -s pawno/include/nyx_jobs.inc
          test -s pawno/include/nyx_marriage.inc
          test -s pawno/include/nyx_admin_text.inc

      - name: Compile NYX GameMode
        run: |
          set -euo pipefail
          COMPILER=$(find pawnc -type f -name pawncc | head -1)
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH:-}"
          mkdir -p build/gamemodes
          "$COMPILER" "gamemodes/nyx_roleplay.pwn" "-i:pawno/include" "-i:build/include" "-;+" "-(+" "-Z-" "-d3" "-O2" "-t4" "-o:build/gamemodes/nyx_roleplay" 2>&1 | tee build/compile.log
          test -s build/gamemodes/nyx_roleplay.amx

      - name: Compile NYX Fire filterscript
        run: |
          set -euo pipefail
          if [ ! -f filterscripts/nyx_fire.pwn ]; then
            echo 'filterscripts/nyx_fire.pwn não existe; pulando este filterscript.'
            exit 0
          fi
          COMPILER=$(find pawnc -type f -name pawncc | head -1)
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH:-}"
          mkdir -p build/filterscripts
          "$COMPILER" "filterscripts/nyx_fire.pwn" "-i:pawno/include" "-i:build/include" "-;+" "-(+" "-Z-" "-d3" "-O2" "-t4" "-o:build/filterscripts/nyx_fire" 2>&1 | tee build/fire-compile.log
          test -s build/filterscripts/nyx_fire.amx

      - name: Assemble LameHost Linux package
        run: |
          set -e
          mkdir -p release/gamemodes release/filterscripts release/plugins
          cp build/gamemodes/nyx_roleplay.amx release/gamemodes/nyx_roleplay.amx
          if [ -f build/filterscripts/nyx_fire.amx ]; then cp build/filterscripts/nyx_fire.amx release/filterscripts/nyx_fire.amx; fi
          cp build/plugins/sscanf.so release/plugins/sscanf.so
          cp build/plugins/pawncmd.so release/plugins/pawncmd.so
          [ -f server.cfg ] && cp server.cfg release/server.cfg || true
          cp build/compile.log release/compile.log
          cat > release/README-NYX-LAMEHOST.txt <<'EOF'
NYX ROLEPLAY - LAMEHOST LINUX PACKAGE

Upload the CONTENTS of this package to the server root.
Required runtime plugins:
  plugins/sscanf.so
  plugins/pawncmd.so

server.cfg:
  plugins sscanf pawncmd
  gamemode0 nyx_roleplay 1

If nyx_fire.amx is present, add:
  filterscripts nyx_fire
EOF
          test -s release/gamemodes/nyx_roleplay.amx
          test -s release/plugins/sscanf.so
          test -s release/plugins/pawncmd.so
          cd release
          zip -r ../nyx-roleplay-linux-server.zip .

      - name: Upload NYX Linux server package
        uses: actions/upload-artifact@v4
        with:
          name: nyx-roleplay-linux-server
          path: nyx-roleplay-linux-server.zip
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-roleplay-compile-log
          path: build/*.log
          if-no-files-found: ignore
