name: Build NYX GameMode

on:
  push:
    paths:
      - 'gamemodes/**'
      - 'filterscripts/**'
      - 'pawno/include/**'
      - '.github/workflows/build-nyx-gamemode.yml'
      - 'server.cfg'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pawn compiler
        run: |
          curl -L --fail -o pawnc.tar.gz https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc

      - name: Get SA-MP includes and runtime plugins
        run: |
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib
          git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib.git omp-stdlib
          mkdir -p build/include build/plugins
          find samp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find omp-stdlib -type f -name '*.inc' -exec cp {} build/include/ \;
          find pawno/include -maxdepth 1 -type f -name '*.inc' -exec cp {} build/include/ \;
          curl -L --fail -o build/include/sscanf2.inc https://raw.githubusercontent.com/Y-Less/sscanf/master/sscanf2.inc
          test -s build/include/a_samp.inc
          test -s build/include/sscanf2.inc

          curl -L --fail -o sscanf-linux.tar.gz https://github.com/Y-Less/sscanf/releases/download/v2.13.8/sscanf-2.13.8-linux.tar.gz
          mkdir -p third_party/sscanf
          tar -xzf sscanf-linux.tar.gz -C third_party/sscanf
          find third_party/sscanf -type f -name 'sscanf.so' -exec cp {} build/plugins/sscanf.so \;

          curl -L --fail -o pawncmd-linux.tar.gz https://github.com/katursis/Pawn.CMD/releases/download/3.3.6/pawncmd-3.3.6-linux.tar.gz
          mkdir -p third_party/pawncmd
          tar -xzf pawncmd-linux.tar.gz -C third_party/pawncmd
          find third_party/pawncmd -type f -name 'pawncmd.so' -exec cp {} build/plugins/pawncmd.so \;

          test -s build/plugins/sscanf.so
          test -s build/plugins/pawncmd.so
          ls -lh build/plugins

      - name: Integrate NYX Admin Text dispatcher
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('gamemodes/nyx_roleplay.pwn')
          text = path.read_text(encoding='utf-8')

          include = '#include <nyx_admin_text>'
          if include not in text:
              marker = '#include <a_samp>'
              if marker not in text:
                  raise SystemExit('ERRO: include <a_samp> nao encontrado; integracao abortada.')
              text = text.replace(marker, marker + '\n' + include, 1)

          callback = re.compile(r'public\s+OnPlayerCommandText\s*\(\s*playerid\s*,\s*cmdtext\s*\[\s*\]\s*\)\s*\{')
          match = callback.search(text)
          if not match:
              raise SystemExit('ERRO: callback OnPlayerCommandText nao encontrada; nenhum arquivo foi compilado.')

          dispatch = '    if(NYX_AdminCommandText(playerid,cmdtext)) return 1;\n'
          body_start = match.end()
          if 'NYX_AdminCommandText(playerid,cmdtext)' not in text[body_start:body_start + 1200]:
              text = text[:body_start] + '\n' + dispatch + text[body_start:]

          path.write_text(text, encoding='utf-8')
          print('NYX Admin Text integrado com sucesso.')
          PY

          grep -n "#include <nyx_admin_text>" gamemodes/nyx_roleplay.pwn
          grep -n "NYX_AdminCommandText(playerid,cmdtext)" gamemodes/nyx_roleplay.pwn

      - name: Compile NYX GameMode
        run: |
          COMPILER=$(find pawnc -type f -name pawncc | head -1)
          test -n "$COMPILER"
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH}"
          mkdir -p build/gamemodes
          set -o pipefail
          "$COMPILER" "gamemodes/nyx_roleplay.pwn" "-i:pawno/include" "-i:build/include" "-;+" "-(+" "-Z-" "-d0" "-O2" "-t4" "-o:build/gamemodes/nyx_roleplay" 2>&1 | tee build/compile.log
          test -s build/gamemodes/nyx_roleplay.amx

      - name: Compile NYX Fire filterscript
        run: |
          COMPILER=$(find pawnc -type f -name pawncc | head -1)
          chmod +x "$COMPILER"
          export LD_LIBRARY_PATH="$(dirname "$COMPILER")/../lib:${LD_LIBRARY_PATH}"
          mkdir -p build/filterscripts
          set -o pipefail
          "$COMPILER" "filterscripts/nyx_fire.pwn" "-i:pawno/include" "-i:build/include" "-;+" "-(+" "-Z-" "-d0" "-O2" "-t4" "-o:build/filterscripts/nyx_fire" 2>&1 | tee build/fire-compile.log
          test -s build/filterscripts/nyx_fire.amx

      - name: Assemble Linux NYX server package
        run: |
          mkdir -p release/gamemodes release/filterscripts release/plugins
          cp build/gamemodes/nyx_roleplay.amx release/gamemodes/nyx_roleplay.amx
          cp build/filterscripts/nyx_fire.amx release/filterscripts/nyx_fire.amx
          cp build/plugins/sscanf.so release/plugins/sscanf.so
          cp build/plugins/pawncmd.so release/plugins/pawncmd.so
          if [ -f server.cfg ]; then cp server.cfg release/server.cfg; fi
          cat > release/README-NYX-LAMEHOST.txt <<'EOF'
          NYX ROLEPLAY - LINUX SERVER PACKAGE

          Upload the contents of this package to the LameHost server root.
          The plugins MUST remain in the plugins/ directory:
            plugins/sscanf.so
            plugins/pawncmd.so

          server.cfg must contain:
            plugins sscanf pawncmd
            filterscripts nyx_fire
            gamemode0 nyx_roleplay 1

          After uploading, restart the server and confirm the log says:
            Loaded 2 plugins.
          EOF
          test -s release/gamemodes/nyx_roleplay.amx
          test -s release/filterscripts/nyx_fire.amx
          test -s release/plugins/sscanf.so
          test -s release/plugins/pawncmd.so
          cd release
          zip -r ../nyx-roleplay-linux-server.zip .

      - name: Upload NYX Linux server package
        uses: actions/upload-artifact@v4
        with:
          name: nyx-roleplay-linux-server
          path: nyx-roleplay-linux-server.zip
          if-no-files-found: error
