name: Build NYX 3D Android Game

on:
  push:
    branches:
      - nyx-build-test
    paths:
      - 'client/godot/**'
      - '.github/workflows/build-nyx-3d-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          wget -q https://downloads.godotengine.org/4.4.1/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://downloads.godotengine.org/4.4.1/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/. ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import and validate project
        run: godot --headless --path client/godot --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path client/godot --export-debug "NYX Roleplay Android" build/NYX-Roleplay-debug.apk
          test -s build/NYX-Roleplay-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NYX-Roleplay-3D-debug
          path: build/NYX-Roleplay-debug.apk
